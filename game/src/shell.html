<title>Carapicuíba Royale</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700;800&display=swap">
<style>
/* Layout: jogo em tela cheia; HUD ancorado nos cantos; menus em folhas que deixam o personagem 3D visível. */
:root{--bg:#0d1014;--panel:rgba(15,19,24,.9);--panel2:rgba(28,34,41,.92);--line:rgba(255,255,255,.13);--fg:#eef1f3;--dim:#9aa3ab;--acc:#f2c230;--acc2:#4aa8e0;--bad:#e85a4a;--good:#5fd47a;--disp:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;--body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:dark;--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.disp{font-family:var(--disp);letter-spacing:.04em;text-transform:uppercase}
#hud,#touch,#menu,#panel,#toasts,#loading,#edit{position:fixed;inset:0;pointer-events:none}
#hud>*{position:absolute}
/* ── HUD ── */
#h-stat{left:calc(58px + var(--sl));top:calc(13px + var(--st));font:700 14px var(--disp);letter-spacing:.06em;text-shadow:0 1px 4px #000;font-variant-numeric:tabular-nums;white-space:nowrap}
#h-stat b{color:var(--acc)}
#h-feed{left:calc(12px + var(--sl));top:calc(126px + var(--st));font-size:11.5px;display:flex;flex-direction:column;gap:2px;max-width:56vw;text-shadow:0 1px 3px #000}
#h-feed div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#h-feed i{color:var(--dim);font-style:normal;margin:0 4px}#h-feed b.ally{color:var(--acc2)}
#h-mini{right:calc(10px + var(--sr));top:calc(10px + var(--st));width:112px}
#h-mini canvas{width:112px;height:112px;border-radius:6px;border:1px solid var(--line);background:#20262c;display:block;pointer-events:auto}
#h-zone{position:absolute;left:1px;right:1px;top:89px;height:22px;border-radius:0 0 5px 5px;background:linear-gradient(transparent,rgba(0,0,0,.7));font:700 13px/26px var(--disp);letter-spacing:.08em;text-align:center;color:var(--acc);font-variant-numeric:tabular-nums;pointer-events:none}
#h-contract{margin-top:4px;background:rgba(12,15,19,.6);border-left:3px solid var(--acc);border-radius:4px;padding:4px 6px;font-size:10.5px;line-height:1.25}
#h-banner{left:50%;top:18%;transform:translateX(-50%);text-align:center;width:min(92vw,560px);transition:opacity .3s;opacity:0}
#h-banner b{display:block;font:800 clamp(24px,6vw,40px)/1 var(--disp);letter-spacing:.06em;text-shadow:0 2px 14px #000}#h-banner span{font:600 14px var(--body);color:var(--acc);text-shadow:0 1px 6px #000}
#h-prompt{left:50%;bottom:calc(38% + var(--sb));transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:6px 12px;font-size:13px;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
#h-prompt kbd{font:700 12px var(--disp);background:var(--acc);color:#111;border-radius:3px;padding:1px 6px;margin-right:7px}
#h-cross{left:50%;top:50%;width:0;height:0;--sp:10px}
#h-cross i{position:absolute;background:#fff;box-shadow:0 0 2px #000;opacity:.9}
#h-cross i:nth-child(1){width:2px;height:8px;left:-1px;top:calc(-8px - var(--sp))}#h-cross i:nth-child(2){width:2px;height:8px;left:-1px;top:var(--sp)}#h-cross i:nth-child(3){height:2px;width:8px;top:-1px;left:calc(-8px - var(--sp))}#h-cross i:nth-child(4){height:2px;width:8px;top:-1px;left:var(--sp)}#h-cross i:nth-child(5){width:2px;height:2px;left:-1px;top:-1px}
#h-hit{left:50%;top:50%;width:26px;height:26px;margin:-13px;opacity:0;background:linear-gradient(45deg,transparent 44%,#fff 44%,#fff 56%,transparent 56%),linear-gradient(-45deg,transparent 44%,#fff 44%,#fff 56%,transparent 56%);-webkit-mask:radial-gradient(circle,transparent 5px,#000 6px);mask:radial-gradient(circle,transparent 5px,#000 6px)}
#h-hit.head{filter:drop-shadow(0 0 2px #f33) sepia(1) saturate(9) hue-rotate(-30deg)}#h-hit.kill{filter:sepia(1) saturate(12) hue-rotate(-50deg);transform:scale(1.35)}#h-hit.armor{filter:sepia(1) saturate(8) hue-rotate(170deg)}
#h-ret{left:50%;top:50%;width:0;height:0}#h-ret i{position:absolute;display:block}
#h-ret.reddot i{width:6px;height:6px;margin:-3px;border-radius:50%;background:#ff3b2a;box-shadow:0 0 6px #ff3b2a}
#h-ret.iron i{width:3px;height:3px;margin:-1.5px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 0 2px #000}
#h-ret.holo i{width:38px;height:38px;margin:-19px;border-radius:50%;border:2px solid #ff3b2a;box-shadow:0 0 5px #ff3b2a}#h-ret.holo i::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:#ff3b2a}
#h-scope{inset:0;--r:min(46vw,36vh);background:radial-gradient(circle at 50% 50%,transparent 0,transparent var(--r),rgba(0,0,0,.92) calc(var(--r) + 2px),#000 100%)}
#h-scope::before,#h-scope::after{content:"";position:absolute;background:#0a0a0a}#h-scope::before{left:50%;top:calc(50% - var(--r));height:calc(var(--r)*2);width:1.5px;margin-left:-.75px}#h-scope::after{top:50%;left:calc(50% - var(--r));width:calc(var(--r)*2);height:1.5px;margin-top:-.75px}
#h-dmg,#h-gas,#h-flash{inset:0;opacity:0}#h-dmg{background:radial-gradient(ellipse at center,transparent 45%,rgba(190,20,10,.75) 100%)}#h-gas{background:radial-gradient(ellipse at center,rgba(255,150,40,.12) 20%,rgba(230,110,20,.5) 100%)}#h-flash{background:#fff}
#h-dir{left:50%;top:50%;width:150px;height:150px;margin:-75px;opacity:0}#h-dir::before{content:"";position:absolute;left:50%;top:0;margin-left:-22px;border:22px solid transparent;border-bottom:14px solid rgba(232,60,40,.9);border-top:0;transform:rotate(180deg)}
#h-weap{left:calc(12px + var(--sl));top:calc(56px + var(--st));display:flex;flex-direction:column;gap:6px;width:128px;pointer-events:auto}
#h-vital{display:flex;flex-direction:column;gap:2px}
#h-armor{display:flex;gap:2px;height:4px}#h-armor i{flex:1;background:rgba(255,255,255,.18);border-radius:2px;overflow:hidden}#h-armor i b{display:block;height:100%;background:var(--acc2)}
#h-hp{height:7px;background:rgba(255,255,255,.18);border-radius:2px;overflow:hidden}#h-hp b{display:block;height:100%;background:#f2f2f2;transition:width .12s}
.ws{text-align:left;font:700 12px var(--disp);letter-spacing:.05em;line-height:1.1;text-shadow:0 1px 4px #000;width:fit-content;max-width:100%;white-space:nowrap}.ws small{display:block;font:700 20px var(--disp);font-variant-numeric:tabular-nums}.ws small em{font-style:normal;color:rgba(255,255,255,.7);font-size:13px}
#h-pick{right:calc(12px + var(--sr));top:46%;display:flex;flex-direction:column;align-items:flex-end;gap:3px;font:600 13px var(--disp);letter-spacing:.04em}#h-pick div{background:rgba(10,13,16,.6);padding:2px 8px;border-radius:3px;animation:fade 2.2s forwards}
#h-kill{left:50%;top:62%;transform:translateX(-50%);font:800 20px var(--disp);letter-spacing:.08em;color:var(--bad);text-shadow:0 2px 8px #000;opacity:0;white-space:nowrap}
#h-info{left:50%;top:32%;transform:translateX(-50%);text-align:center;font:700 18px var(--disp);letter-spacing:.06em;text-shadow:0 2px 8px #000;width:90vw}
#h-info small{display:block;font:500 13px var(--body);color:var(--dim);letter-spacing:0}
#diag{left:calc(10px + var(--sl));bottom:calc(46% + var(--sb));font:500 10.5px/1.35 ui-monospace,Menlo,Consolas,monospace;background:rgba(0,0,0,.6);padding:5px 7px;border-radius:4px;white-space:pre;color:#bfe8c8}
@keyframes fade{0%{opacity:0;transform:translateX(10px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
@media (max-aspect-ratio:1/1){#h-prompt{bottom:calc(396px + var(--sb))}#h-banner{top:30%}#h-info{top:38%}#diag{bottom:auto;top:calc(200px + var(--st))}}
/* ── botões de toque ── */
.hb{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(18,22,27,.4);border:1px solid rgba(255,255,255,.4);display:grid;place-items:center;font:700 11px var(--disp);letter-spacing:.05em;color:#fff;touch-action:none;box-sizing:border-box}
.hb.on{background:rgba(242,194,48,.55);border-color:var(--acc)}.hb b{position:absolute;right:-2px;top:-4px;background:var(--acc);color:#111;border-radius:8px;min-width:15px;height:15px;font:700 11px/15px var(--disp);text-align:center;padding:0 2px}.hb b:empty{display:none}
.hb.joy{border-style:dashed;background:rgba(18,22,27,.3)}.hb.joy i{width:42%;height:42%;border-radius:50%;background:rgba(255,255,255,.42);display:block}
.hb[data-k=fire],.hb[data-k=fireL]{background:rgba(232,90,74,.42);border-color:rgba(255,160,150,.8);font-size:20px!important}.hb[data-k=run].on{background:rgba(95,212,122,.55);border-color:var(--good)}.hb[data-k=interact]{border-radius:12px;background:rgba(242,194,48,.75);color:#111;border-color:#fff}
body:not(.touch) #touch .hb:not([data-k=pause]){display:none}
#edit{pointer-events:none}#edit .bar{position:absolute;left:50%;top:calc(8px + var(--st));transform:translateX(-50%);pointer-events:auto;background:var(--panel);border:1px solid var(--acc);border-radius:8px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;width:min(94vw,520px);font-size:12px}
body.editing .hb{display:grid!important;outline:1px dashed var(--acc);opacity:1!important}body.editing .hb.sel{outline:2px solid #fff;background:rgba(242,194,48,.5)}
/* ── menu ── */
#menu{display:grid;grid-template-rows:auto 1fr auto;padding:calc(10px + var(--st)) calc(14px + var(--sr)) calc(10px + var(--sb)) calc(14px + var(--sl));box-sizing:border-box;background:linear-gradient(180deg,rgba(8,10,13,.72) 0,rgba(8,10,13,0) 22%,rgba(8,10,13,0) 58%,rgba(8,10,13,.86) 100%)}
#menu>*{pointer-events:auto}
#m-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
#logo{text-align:left;line-height:.86}#logo b{display:block;font:800 clamp(26px,7vw,40px)/.9 var(--disp);letter-spacing:.03em}#logo span{display:inline-block;font:800 clamp(13px,3.4vw,18px) var(--disp);letter-spacing:.42em;color:#111;background:var(--acc);padding:1px 5px 0 9px;margin-top:4px}
#coins{font:700 16px var(--disp);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:5px 10px;font-variant-numeric:tabular-nums}#coins i{color:var(--acc);font-style:normal;margin-right:5px}
#m-mid{display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:6px;min-height:0;pointer-events:none!important}
#m-who{font:800 26px/1 var(--disp);letter-spacing:.05em;text-shadow:0 2px 10px #000}#m-who small{display:block;font:700 12px var(--disp);letter-spacing:.2em;color:var(--acc)}
#m-bot{display:flex;flex-direction:column;gap:9px;margin-top:10px}
#m-play{display:flex;gap:8px;align-items:stretch}
#b-play{flex:1;background:var(--acc);color:#111;font:800 28px var(--disp);letter-spacing:.12em;border-radius:6px;padding:10px 12px;box-shadow:0 6px 24px rgba(242,194,48,.25)}#b-play:active{transform:translateY(1px)}
#b-mode{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;text-align:left;min-width:128px}#b-mode small{display:block;font:600 10px var(--disp);letter-spacing:.18em;color:var(--dim)}#b-mode b{font:700 17px var(--disp);letter-spacing:.05em}
#m-nav{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}#m-nav button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 2px 6px;font:700 11.5px var(--disp);letter-spacing:.05em;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}#m-nav button i{font-style:normal;font-size:17px;line-height:1}#m-nav button.on{border-color:var(--acc);color:var(--acc)}
@media (min-aspect-ratio:13/10){#menu{grid-template-columns:1fr minmax(260px,34vw);grid-template-rows:auto 1fr;column-gap:16px;background:linear-gradient(90deg,rgba(8,10,13,.1) 0,rgba(8,10,13,0) 50%,rgba(8,10,13,.86) 100%)}#m-top{grid-column:1/3}#m-mid{grid-column:1;grid-row:2}#m-bot{grid-column:2;grid-row:2;justify-content:flex-end}#m-nav{grid-template-columns:repeat(3,1fr)}}
/* ── painéis ── */
#panel{display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr);place-items:end center;background:rgba(5,7,9,.35)}
#panel.full{place-items:center;background:rgba(5,7,9,.72)}
.sheet{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px 12px 0 0;width:min(100vw,640px);max-height:66%;display:flex;flex-direction:column;box-sizing:border-box;padding:0 0 var(--sb)}
#panel.full .sheet{border-radius:12px;max-height:92%;width:min(94vw,640px)}
@media (min-aspect-ratio:13/10){#panel:not(.full){place-items:center end}#panel:not(.full) .sheet{border-radius:12px 0 0 12px;max-height:100%;height:100%;width:min(48vw,520px);padding-right:var(--sr)}}
.sheet>header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 8px;border-bottom:1px solid var(--line)}.sheet>header h2{margin:0;font:800 22px var(--disp);letter-spacing:.06em;text-transform:uppercase}
.x{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.1);font-size:18px;line-height:1}
.body{overflow:auto;padding:10px 14px 14px;display:flex;flex-direction:column;gap:10px;min-height:0;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.tabs{display:flex;gap:5px;flex-wrap:wrap}.tabs button,.chip{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:5px;padding:5px 10px;font:700 13px var(--disp);letter-spacing:.05em;text-transform:uppercase}.tabs button.on,.chip.on{background:var(--acc);color:#111;border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:7px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:8px 9px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;position:relative}.card.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}.card b{font:700 16px var(--disp);letter-spacing:.03em}.card small{color:var(--dim);font-size:11.5px;line-height:1.25}.card em{font:700 11px var(--disp);letter-spacing:.1em;font-style:normal;text-transform:uppercase}.card .tag{position:absolute;right:7px;top:6px;font:700 10px var(--disp);letter-spacing:.1em;color:#111;background:var(--acc);border-radius:3px;padding:0 5px}
.bars{display:grid;grid-template-columns:74px 1fr 34px;gap:3px 8px;align-items:center;font-size:11.5px;color:var(--dim)}.bars i{height:5px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden;display:block}.bars i b{display:block;height:100%;background:var(--acc2)}.bars span:nth-child(3n){color:var(--fg);font:700 12px var(--disp);text-align:right;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;min-height:34px}.row>span{min-width:0}.row small{display:block;color:var(--dim);font-size:11px}
.row input[type=range]{width:46%;accent-color:var(--acc)}.row select{background:#1c2229;color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:5px 6px;font:inherit}
.sw{width:44px;height:24px;border-radius:12px;background:rgba(255,255,255,.16);position:relative;flex:none}.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}.sw.on{background:var(--acc)}.sw.on::after{left:23px}
.btn{background:var(--acc);color:#111;font:800 15px var(--disp);letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:9px 14px}.btn.alt{background:rgba(255,255,255,.1);color:var(--fg);border:1px solid var(--line)}.btn.bad{background:var(--bad);color:#fff}.btn:disabled{opacity:.4}
.h3{font:700 13px var(--disp);letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-top:4px}
.inv{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center;font-size:13px}.inv>div{background:var(--panel2);border-radius:5px;padding:6px 9px;border-left:3px solid var(--line);min-width:0}.inv small{color:var(--dim);display:block;font-size:11px}
.end{text-align:center;padding:8px 0}.end h1{font:800 clamp(34px,10vw,58px)/.95 var(--disp);letter-spacing:.06em;margin:4px 0}.end h1.win{color:var(--acc)}.end .st{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}.end .st div{background:var(--panel2);border-radius:6px;padding:8px 2px}.end .st b{display:block;font:800 24px var(--disp);font-variant-numeric:tabular-nums}.end .st small{color:var(--dim);font-size:11px}
#mapc{width:100%;max-width:560px;aspect-ratio:1;border-radius:8px;display:block;margin:0 auto;background:#20262c}
#toasts{display:flex;flex-direction:column;align-items:center;gap:5px;padding-top:calc(27vh + var(--st))}#toasts div{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:5px;padding:6px 12px;font-size:13px;animation:fade 2.6s forwards;max-width:86vw}
#loading{display:grid;place-items:center;background:var(--bg);pointer-events:auto;text-align:center}#loading b{font:800 clamp(30px,9vw,54px)/.9 var(--disp);letter-spacing:.03em;display:block}#loading span{font:800 15px var(--disp);letter-spacing:.42em;color:#111;background:var(--acc);padding:1px 5px 0 9px}#loading p{color:var(--dim);font-size:13px;margin:16px 0 0}#loading u{display:block;width:200px;height:3px;background:rgba(255,255,255,.12);margin:12px auto 0;border-radius:2px;overflow:hidden;text-decoration:none}#loading u i{display:block;height:100%;width:30%;background:var(--acc);animation:ld 1.1s infinite ease-in-out}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>
<canvas id="gl" tabindex="0"></canvas>
<div id="hud" hidden>
  <div id="h-dmg"></div><div id="h-gas"></div><div id="h-scope" hidden></div><div id="h-flash"></div>
  <div id="h-stat"></div>
  <div id="h-feed"></div>
  <div id="h-mini"><canvas id="mini" width="256" height="256"></canvas><div id="h-zone" hidden></div><div id="h-contract" hidden></div></div>
  <div id="h-banner"><b></b><span></span></div><div id="h-info" hidden></div><div id="h-prompt" hidden></div>
  <div id="h-cross"><i></i><i></i><i></i><i></i><i></i></div><div id="h-ret" hidden><i></i></div><div id="h-hit"></div><div id="h-dir"></div>
  <div id="h-pick"></div><div id="h-kill"></div>
  <div id="h-weap"><div id="h-vital"><div id="h-armor"><i><b></b></i><i><b></b></i><i><b></b></i></div><div id="h-hp"><b></b></div></div><div id="h-slots"></div></div>

</div>
<div id="touch" hidden></div>
<div id="menu" hidden></div>
<div id="panel" hidden></div>
<div id="edit" hidden></div>
<div id="toasts"></div>
<div id="loading"><div><b>CARAPICUÍBA</b><span>ROYALE</span><p id="ld-msg">Construindo a cidade…</p><u><i></i></u></div></div>
